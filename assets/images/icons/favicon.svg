<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17133f"/>
      <stop offset="0.5" stop-color="#080b20"/>
      <stop offset="1" stop-color="#073d3b"/>
    </linearGradient>

    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)"/>

  <!-- subtle orbit -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#orbit)"
          stroke-width="1.2" opacity=".35"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#orbit)"
          stroke-width="1" opacity=".25"
          stroke-dasharray="10 7"/>

  <!-- orbit dots -->
  <circle cx="13" cy="23" r="2" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="51" cy="18" r="1.8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="49" cy="50" r="2" fill="#2dd4bf" filter="url(#glow)"/>

  <!-- MR monogram -->
  <path d="M14 45V20l11 12 11-12v25"
        fill="none"
        stroke="url(#logo)"
        stroke-width="5.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M36 20h5.5c5 0 8.5 3.2 8.5 7.8s-3.5 7.8-8.5 7.8H36
           M42 35.6l9 9.4"
        fill="none"
        stroke="url(#logo)"
        stroke-width="5.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
